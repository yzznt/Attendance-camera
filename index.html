<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Camera</title>

<style>

body{

    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;

}

h2{

    margin-bottom:10px;

}

video,
canvas{

    width:100%;
    max-width:420px;
    border-radius:15px;
    background:black;

}

canvas{

    display:none;

}

button{

    margin-top:15px;
    padding:15px 25px;
    font-size:18px;
    border:none;
    border-radius:12px;
    cursor:pointer;

}

#retakeBtn,
#useBtn{

    display:none;

}

</style>

</head>

<body>

<h2>Attendance Camera v2</h2>

<video
id="video"
autoplay
playsinline
muted>
</video>

<canvas id="canvas"></canvas>

<button id="captureBtn" onclick="capture()">
Capture
</button>

<button id="retakeBtn" onclick="retake()">
Retake
</button>

<button id="useBtn">
Use Photo
</button>

<script>

const video=document.getElementById("video");

navigator.mediaDevices.getUserMedia({

    video:{
        facingMode:"user"
    }

})

.then(stream=>{

    video.srcObject=stream;

})

.catch(err=>{

    alert(err.name + "\n" + err.message);

});

function capture(){

    const canvas=document.getElementById("canvas");

    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;

    const ctx=canvas.getContext("2d");

    ctx.drawImage(video,0,0);

    video.style.display="none";
    canvas.style.display="block";

    document.getElementById("captureBtn").style.display="none";
    document.getElementById("retakeBtn").style.display="inline-block";
    document.getElementById("useBtn").style.display="inline-block";

}

function retake(){

    video.style.display="block";
    document.getElementById("canvas").style.display="none";

    document.getElementById("captureBtn").style.display="inline-block";
    document.getElementById("retakeBtn").style.display="none";
    document.getElementById("useBtn").style.display="none";

}

</script>

</body>

</html>
