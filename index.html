<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Camera</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

h2{
    margin-bottom:10px;
}

video,
canvas{
    width:100%;
    max-width:420px;
    border-radius:15px;
    background:black;
}

canvas{
    display:none;
}

button{
    margin-top:15px;
    padding:15px 25px;
    font-size:18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

#retakeBtn,
#useBtn{
    display:none;
}

#status{
    margin-top:15px;
    color:#8cff8c;
}

</style>

</head>

<body>

<h2>Attendance Camera</h2>

<video
id="video"
autoplay
playsinline
muted>
</video>

<canvas id="canvas"></canvas>

<button id="captureBtn" onclick="capture()">
Capture
</button>

<button id="retakeBtn" onclick="retake()">
Retake
</button>

<button id="useBtn" onclick="uploadPhoto()">
Use Photo
</button>

<p id="status"></p>

<script>

// ==============================
// Read Employee ID from URL
// Example:
// ?emp=EMP001
// ==============================

const params = new URLSearchParams(window.location.search);
const employeeId = params.get("emp");

// ==============================
// Start Camera
// ==============================

const video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({

    video:{
        facingMode:"user"
    }

})

.then(stream=>{

    video.srcObject = stream;

})

.catch(err=>{

    alert(err.name + "\n" + err.message);

});

// ==============================
// Capture
// ==============================

function capture(){

    const canvas = document.getElementById("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    ctx.drawImage(video,0,0);

    video.style.display="none";
    canvas.style.display="block";

    document.getElementById("captureBtn").style.display="none";
    document.getElementById("retakeBtn").style.display="inline-block";
    document.getElementById("useBtn").style.display="inline-block";

}

// ==============================
// Retake
// ==============================

function retake(){

    video.style.display="block";
    document.getElementById("canvas").style.display="none";

    document.getElementById("captureBtn").style.display="inline-block";
    document.getElementById("retakeBtn").style.display="none";
    document.getElementById("useBtn").style.display="none";

}

// ==============================
// Upload
// ==============================

async function uploadPhoto(){

    if(!employeeId){

        alert("Employee ID not found.");

        return;

    }

    document.getElementById("status").innerText="Uploading...";

    const canvas = document.getElementById("canvas");

    const image = canvas.toDataURL("image/jpeg",0.9);

    try{

        const response = await fetch("https://script.google.com/a/macros/loricogroup.com/s/AKfycbzaAxIxc4e7XuMAOsYGmfnCIGE5vIaCHxfOnBu0DF9ZRn_erayqPuJ104UDvF-Nw5inTQ/exec",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                employeeId:employeeId,

                capturedAt:new Date().toISOString(),

                image:image

            })

        });

        const result = await response.text();

        document.getElementById("status").innerText=result;

        alert(result);

    }

    catch(e){

        console.error(e);

        alert("Upload failed.");

    }

}

</script>

</body>
</html>
