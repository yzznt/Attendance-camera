<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Camera</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

h2{
    margin-bottom:10px;
}

video,
canvas{
    width:100%;
    max-width:420px;
    border-radius:15px;
    background:black;
}

canvas{
    display:none;
}

button{
    margin-top:15px;
    padding:15px 25px;
    font-size:18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

#retakeBtn,
#useBtn{
    display:none;
}

    
#status{
    margin-top:15px;
    color:#8cff8c;
    font-size:16px;
}


#spinner{
    display:none;
    width:40px;
    height:40px;
    margin-top:20px;

    border:4px solid #444;
    border-top:4px solid white;
    border-radius:50%;

    animation:spin 1s linear infinite;
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}
    
</style>

</head>

<body>

<h2>Attendance Camera</h2>

<video
id="video"
autoplay
playsinline
muted>
</video>

<canvas id="canvas"></canvas>

<button id="captureBtn" onclick="capture()">
Capture
</button>

<button id="retakeBtn" onclick="retake()">
Retake
</button>

<button id="useBtn" onclick="uploadPhoto()">
Use Photo
</button>

<div id="spinner"></div>

<p id="status"></p>

<script>

// ==============================
// Read Employee ID from URL
// Example:
// ?emp=EMP001
// ==============================

const params = new URLSearchParams(window.location.search);
const employeeId = params.get("emp");

// ==============================
// Start Camera
// ==============================

const video = document.getElementById("video");
const useBtn = document.getElementById("useBtn");
const retakeBtn = document.getElementById("retakeBtn");
const spinner = document.getElementById("spinner");
const status = document.getElementById("status");
    
navigator.mediaDevices.getUserMedia({

    video:{
        facingMode:"user"
    }

})

.then(stream=>{

    video.srcObject = stream;

})

.catch(err=>{

    alert(err.name + "\n" + err.message);

});

// ==============================
// Capture
// ==============================

function capture(){

    const canvas = document.getElementById("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    ctx.drawImage(video,0,0);

    video.style.display="none";
    canvas.style.display="block";

    document.getElementById("captureBtn").style.display="none";
    retakeBtn.style.display="inline-block";
    useBtn.style.display="inline-block";

}

// ==============================
// Retake
// ==============================

function retake(){

    video.style.display="block";
    document.getElementById("canvas").style.display="none";

    document.getElementById("captureBtn").style.display="inline-block";
    retakeBtn.style.display="none";
    useBtn.style.display="none";

}

// ==============================
// Upload
// ==============================

async function uploadPhoto(){

    if(!employeeId){

        alert("Employee ID not found.");
        return;

    }

    // Prevent duplicate uploads
    useBtn.disabled = true;
    useBtn.textContent = "Uploading...";

    retakeBtn.disabled = true;
    retakeBtn.textContent = "Please wait...";

    spinner.style.display = "block";
    status.innerText = "Uploading photo...\nPlease wait.";

    // Give browser time to repaint buttons
    await new Promise(resolve => setTimeout(resolve,50));

    const canvas = document.getElementById("canvas");

    const image = canvas.toDataURL("image/jpeg",0.9);

    try{

        await fetch("https://script.google.com/macros/s/AKfycbzHEfurC8Dveue3utBOKcjfd1cWaSfrk57OgBC7KdRsXpfe2KDINztW3mmNi0-nLaK5cg/exec",{

            method:"POST",
            mode:"no-cors",

            body:JSON.stringify({

                employeeId:employeeId,
                capturedAt:new Date().toISOString(),
                image:image

            })

        });

        spinner.style.display = "none";

        document.getElementById("status").innerText =
        "Attendance photo submitted.";

    }

    catch(e){

        spinner.style.display = "none";
        
        useBtn.disabled = false;
        useBtn.textContent = "Use Photo";

        retakeBtn.disabled = false;
        retakeBtn.textContent = "Retake";

        document.getElementById("status").innerText =
        "Upload failed. Please try again.";

        console.error(e);
        alert(e.toString());

    }

}

</script>

</body>
</html>
